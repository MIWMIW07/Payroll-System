<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/add-attendance.css">
</head>
<body>

<header class="top-bar">
    <div class="logo-section">
        <img src="assets/images/logo.png" class="logo" alt="Logo">
        <h1>Philtech GMA</h1>
    </div>

    <button class="back-btn" onclick="goBack()">←</button>
</header>

<main class="form-wrapper">

    <div class="form-card">

        <div class="avatar-circle">👤</div>

        <h2>Add Attendance</h2>

        <form id="attendanceForm">

            <div class="form-grid">

                <div class="dropdown-container">
                    <input type="text" id="employeeInput" placeholder="Employee" readonly required>
                    <div class="dropdown-menu" id="employeeDropdown">
                        <div onclick="selectEmployee('Ayesha Nicole')">Ayesha Nicole</div>
                        <div onclick="selectEmployee('Juan Dela Cruz')">Juan Dela Cruz</div>
                    </div>
                </div>

                <input type="number" placeholder="Days Present" required>

                <input type="text" placeholder="Payroll Period" required>

                <input type="number" placeholder="Overtime Hours" required>

            </div>

            <div class="form-buttons">
                <button type="submit" class="save-btn">Save</button>
                <button type="button" class="cancel-btn" onclick="goBack()">Cancel</button>
            </div>

        </form>

    </div>

</main>
<script src="js/navigation.js"></script>
<script src="js/add-attendance.js"></script>
</body>
</html>
