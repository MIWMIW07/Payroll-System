<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philtech GMA | Guard Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #dcd3b8; }
        .nav-link.active { background-color: #2c5f2d; color: white; }
        .stat-card { transition: all .3s ease; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(44,95,45,.18); }
        .cutoff-filter { background: white; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .filter-select { padding: 8px 16px; border: 1px solid #e5e7eb; border-radius: 8px; background: white; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #2c5f2d; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-700 antialiased min-h-screen">
    <nav class="bg-[#1e3a1e] text-white px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-2"><div class="w-8 h-8 bg-[#2c5f2d] rounded-lg flex items-center justify-center"><i class="fa-solid fa-shield-halved text-[#f4e8c1]"></i></div><span class="font-bold text-lg">Philtech GMA - Guard Portal</span></div>
        <div class="hidden md:flex items-center gap-1">
            <a href="dashboard-guard.html" class="nav-link px-4 py-2 rounded-lg hover:bg-[#4a7c4a] transition-colors font-medium">Dashboard</a>
            <a href="guard-attendance.html" class="nav-link active px-4 py-2 rounded-lg font-medium">My Attendance</a>
            <a href="guard-payslips.html" class="nav-link px-4 py-2 rounded-lg hover:bg-[#4a7c4a] transition-colors font-medium">My Payslips</a>
            <a href="staff-profile.html" class="nav-link px-4 py-2 rounded-lg hover:bg-[#4a7c4a] transition-colors font-medium">Profile</a>
        </div>
        <div class="flex items-center gap-3"><span class="text-sm hidden sm:block" id="userName">Guard</span><img src="https://i.pravatar.cc/150?u=guard" class="w-8 h-8 rounded-full border-2 border-white"></div>
    </nav>

    <main class="p-6 md:p-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div><h1 class="text-2xl font-bold text-[#1e3a1e]">My Attendance</h1><p class="text-gray-500 text-sm mt-1" id="currentDate"></p></div>
            <button onclick="window.location.href='dashboard-guard.html'" class="bg-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:shadow-md transition-shadow flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
        </div>
        <div class="cutoff-filter"><div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">Select Period</label><select id="cutoffSelect" class="filter-select w-full md:w-64" onchange="changeCutoff()"><option value="all">All Periods</option></select></div><div class="text-sm text-gray-500" id="selectedPeriodInfo"></div></div></div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div class="stat-card text-center"><p class="text-xs text-gray-500">Days Present</p><p class="text-xl font-bold text-gray-800" id="daysPresent">0</p></div>
            <div class="stat-card text-center"><p class="text-xs text-gray-500">Total Hours</p><p class="text-xl font-bold text-gray-800" id="totalHours">0</p></div>
            <div class="stat-card text-center"><p class="text-xs text-gray-500">Overtime</p><p class="text-xl font-bold text-yellow-600" id="totalOvertime">0</p></div>
            <div class="stat-card text-center"><p class="text-xs text-gray-500">Lates (min)</p><p class="text-xl font-bold text-red-600" id="totalLates">0</p></div>
            <div class="stat-card text-center"><p class="text-xs text-gray-500">Undertime (hrs)</p><p class="text-xl font-bold text-orange-600" id="undertimeHours">0</p></div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6"><h3 class="font-semibold text-gray-800 mb-4">Guard Duty Trend</h3><div class="h-64"><canvas id="attendanceChart"></canvas></div></div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-800">Detailed Records</h3></div>
            <div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-gray-50 text-xs text-gray-500"><tr><th class="py-3 px-6">Date</th><th class="py-3">Day</th><th class="py-3">Hours Worked</th><th class="py-3">Overtime</th><th class="py-3">Lates</th><th class="py-3">Status</th></tr></thead><tbody class="text-sm" id="attendanceTableBody"><tr><td colspan="6" class="py-8 text-center text-gray-400">Loading...</td></tr></tbody></table></div>
            <div class="px-6 py-3 border-t border-gray-100 flex justify-between items-center"><span class="text-xs text-gray-400" id="paginationInfo">Showing 0-0 of 0</span><div class="flex gap-1" id="paginationControls"></div></div>
        </div>
    </main>
    <div id="loadingOverlay" class="loading-overlay" style="display:none"><div class="spinner"></div></div>
    <script src="js/database.js"></script><script src="js/navigation.js"></script><script src="js/dashboard-common.js"></script>
    <script>
        const theme = '#2c5f2d', dashboardUrl = 'dashboard-guard.html';
        let employeeId = null, allAttendance = [], filteredAttendance = [], currentPage = 1, cutoffs = [], attendanceChart = null;
        const itemsPerPage = 10;
        document.addEventListener('DOMContentLoaded', async () => { document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); await loadEmployeeData(); });
        async function getUser() { if (window.currentUser) return window.currentUser; const r = await fetch('/api/auth/session.php', { credentials: 'include' }).catch(() => null); if (!r || !r.ok) return {}; const d = await r.json(); return d.user || {}; }
        async function loadEmployeeData() {
            DashboardCommon.showLoading(true);
            try {
                await Database.ensureDatabaseReady();
                const user = await getUser();
                document.getElementById('userName').textContent = user.full_name || user.username || 'Guard';
                const employees = await Database.getAllEmployees();
                const employee = employees.find(e => (user.email && e.email === user.email) || (user.employee_id && Number(e.id) === Number(user.employee_id)) || (user.employee_id && String(e.employee_id) === String(user.employee_id))) || employees.find(e => e.assignment === 'guard');
                if (!employee) throw new Error('Employee record not found');
                employeeId = employee.id;
                await loadAttendance();
            } catch (error) {
                document.getElementById('attendanceTableBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">${error.message}</td></tr>`;
            } finally { DashboardCommon.showLoading(false); }
        }
        async function loadAttendance() {
            allAttendance = await Database.getAttendanceByEmployee(employeeId);
            cutoffs = DashboardCommon.getAvailableCutoffs(allAttendance);
            document.getElementById('cutoffSelect').innerHTML = DashboardCommon.renderCutoffFilter(cutoffs, null);
            applyCutoffFilter(cutoffs[0]?.key || 'all');
        }
        function changeCutoff() { applyCutoffFilter(document.getElementById('cutoffSelect').value); }
        function applyCutoffFilter(key) {
            const cutoff = cutoffs.find(c => c.key === key);
            filteredAttendance = cutoff ? DashboardCommon.filterAttendanceByCutoff(allAttendance, cutoff.startStr, cutoff.endStr) : [...allAttendance];
            document.getElementById('selectedPeriodInfo').textContent = cutoff ? `Period: ${cutoff.label}` : 'Showing all records';
            currentPage = 1; updateStats(); renderTable(); updateChart();
        }
        function updateStats() {
            const s = DashboardCommon.calculateAttendanceStats(filteredAttendance);
            daysPresent.textContent = s.daysPresent; totalHours.textContent = s.totalHours; totalOvertime.textContent = s.totalOvertime; totalLates.textContent = s.totalLates; undertimeHours.textContent = s.undertimeHours;
        }
        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage, end = start + itemsPerPage, pageData = filteredAttendance.slice(start, end), totalPages = Math.ceil(filteredAttendance.length / itemsPerPage);
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            attendanceTableBody.innerHTML = pageData.length ? pageData.map(a => { const d = new Date(a.attendance_date || a.date); const h = a.hours_worked || a.hours_attended || 0; const ot = a.overtime_hours || a.ot_hours || a.overtime || 0; const late = a.lates || a.late_hours || 0; return `<tr class="border-b hover:bg-gray-50"><td class="py-3 px-6">${DashboardCommon.formatDate(d)}</td><td class="py-3">${days[d.getDay()]}</td><td class="py-3">${h} hrs</td><td class="py-3">${ot} hrs</td><td class="py-3 ${late > 0 ? 'text-red-600 font-medium' : ''}">${late}</td><td class="py-3"><span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-600">Present</span></td></tr>`; }).join('') : '<tr><td colspan="6" class="py-8 text-center text-gray-400">No attendance records found</td></tr>';
            paginationInfo.textContent = `Showing ${filteredAttendance.length ? start + 1 : 0}-${Math.min(end, filteredAttendance.length)} of ${filteredAttendance.length}`;
            renderPagination(totalPages);
        }
        function renderPagination(totalPages) {
            if (totalPages <= 1) { paginationControls.innerHTML = ''; return; }
            let html = `<button class="w-8 h-8 rounded-lg border ${currentPage === 1 ? 'bg-gray-100 text-gray-400' : ''}" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left text-xs"></i></button>`;
            for (let i = 1; i <= totalPages; i++) html += `<button class="w-8 h-8 rounded-lg ${i === currentPage ? 'text-white' : 'border'}" style="${i === currentPage ? `background:${theme}` : ''}" onclick="changePage(${i})">${i}</button>`;
            html += `<button class="w-8 h-8 rounded-lg border ${currentPage === totalPages ? 'bg-gray-100 text-gray-400' : ''}" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right text-xs"></i></button>`;
            paginationControls.innerHTML = html;
        }
        function changePage(page) { const totalPages = Math.ceil(filteredAttendance.length / itemsPerPage); if (page < 1 || page > totalPages) return; currentPage = page; renderTable(); }
        function updateChart() {
            const ctx = attendanceChart ? null : document.getElementById('attendanceChart').getContext('2d');
            const weeks = ['Week 1','Week 2','Week 3','Week 4'], weeklyHours = [0,0,0,0];
            filteredAttendance.forEach(a => { const d = new Date(a.attendance_date || a.date); const i = Math.floor((d.getDate() - 1) / 7); if (i >= 0 && i < 4) weeklyHours[i] += Number(a.hours_worked || a.hours_attended || 0); });
            if (attendanceChart) attendanceChart.destroy();
            attendanceChart = new Chart(ctx || document.getElementById('attendanceChart').getContext('2d'), { type: 'bar', data: { labels: weeks, datasets: [{ label: 'Hours Worked', data: weeklyHours, backgroundColor: theme, borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
