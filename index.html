<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philtech GMA | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #dcd3b8 0%, #f0e8d0 100%); }
        .login-card { transition: all 0.3s ease; }
        .login-card:hover { transform: translateY(-5px); box-shadow: 0 30px 40px -20px rgba(176, 48, 59, 0.4); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(176, 48, 59, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(176, 48, 59, 0); } 100% { box-shadow: 0 0 0 0 rgba(176, 48, 59, 0); } }
        .avatar-circle { animation: pulse 2s infinite; }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        
        .success-message {
            color: #16a34a;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #b0303b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Card -->
    <div class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl w-full max-w-md p-8 login-card border border-white/20">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-[#b0303b] rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-file-invoice text-white text-3xl"></i>
            </div>
        </div>
        
        <h2 class="text-2xl font-bold text-center text-[#8a1f27] mb-2">Philtech GMA</h2>
        <p class="text-center text-gray-500 text-sm mb-8">Payroll Management System</p>

        <!-- Avatar -->
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-[#b0303b] to-[#8a1f27] rounded-full flex items-center justify-center text-white text-3xl avatar-circle">
                <i class="fa-regular fa-user"></i>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#b0303b] focus:border-transparent transition-all"
                        placeholder="Enter username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required
                        class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#b0303b] focus:border-transparent transition-all"
                        placeholder="Enter password">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#b0303b]">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="rounded text-[#b0303b] focus:ring-[#b0303b]">
                    <span class="text-gray-600">Remember me</span>
                </label>
                <a href="#" id="forgotPassword" class="text-[#b0303b] hover:text-[#8a1f27] transition-colors">Forgot password?</a>
            </div>

            <div id="messageContainer"></div>

            <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-[#b0303b] to-[#8a1f27] text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                Sign In
            </button>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
            Need assistance? 
            <a href="#" class="text-[#b0303b] hover:text-[#8a1f27] font-medium">Contact Administrator</a>
        </p>
    </div>

    <script type="module">
        // Import login function from render-api.js
        import { login as apiLogin } from './js/render-api.js';
        
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }

        // Display message function
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            if (!container) return;
            
            const className = type === 'error' ? 'error-message' : 'success-message';
            container.innerHTML = `<div class="${className}">${text}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // Set loading state
        function setLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            if (!btn) return;
            
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
            } else {
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        // Determine dashboard based on role
        function getDashboardForRole(role) {
            switch(role) {
                case 'superadmin':
                    return 'dashboardSadmin.html';
                case 'accountant':
                    return 'dashboard.html';
                case 'oic':
                    return 'dashboard-oic.html';
                case 'teacher':
                    return 'teacher-dashboard.html';
                case 'admin':
                case 'staff':
                    return 'dashboard-staff.html';
                case 'guard':
                    return 'dashboard-guard.html';
                case 'sa':
                    return 'dashboard-sa.html';
                default:
                    return 'dashboard.html';
            }
        }

        // Login form handler - USES LOCAL render-api.js
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe')?.checked || false;
            
            if (!username || !password) {
                showMessage('Please enter username and password', 'error');
                return;
            }
            
            setLoading(true);
            
            try {
                // Use local login function from render-api.js
                const result = await apiLogin(username, password);
                
                if (result.success) {
                    // Store user info (apiLogin already stores token and user)
                    if (rememberMe) {
                        localStorage.setItem('rememberedUser', username);
                    } else {
                        localStorage.removeItem('rememberedUser');
                    }
                    
                    // Set last login time
                    localStorage.setItem('lastLogin', new Date().toISOString());
                    
                    showMessage(`Welcome, ${result.user.full_name}! Redirecting...`, 'success');
                    
                    // Determine dashboard based on role
                    const redirect = getDashboardForRole(result.user.role);
                    
                    setTimeout(() => {
                        window.location.href = redirect;
                    }, 800);
                    
                } else {
                    showMessage(result.error || 'Invalid username or password', 'error');
                    setLoading(false);
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', 'error');
                setLoading(false);
            }
        });

        // Load remembered username if exists
        const rememberedUser = localStorage.getItem('rememberedUser');
        if (rememberedUser) {
            const usernameInput = document.getElementById('username');
            if (usernameInput) usernameInput.value = rememberedUser;
            const rememberCheckbox = document.getElementById('rememberMe');
            if (rememberCheckbox) rememberCheckbox.checked = true;
        }
        
        // Forgot password handler
        document.getElementById('forgotPassword')?.addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('Please contact the system administrator to reset your password.', 'success');
        });
        
        console.log('Login page ready - Local mode using IndexedDB only');
    </script>
</body>
</html>
