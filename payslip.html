<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philtech GMA | Payslip Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #dcd3b8;
        }
        
        .payslip-preview {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #b0303b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-primary {
            background-color: #b0303b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background-color: #8a1f27;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #6b7280;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background-color: #4b5563;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background-color: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-success:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .payslip-preview {
                box-shadow: none;
                max-height: none;
                overflow: visible;
            }
        }
        
        .status-approved {
            background-color: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        @media print {
    body {
        background: white;
        padding: 0;
        margin: 0;
    }
    .no-print {
        display: none !important;
    }
    .payslip-preview {
        box-shadow: none;
        max-height: none;
        overflow: visible;
    }
    .payslip-pdf-container {
        margin: 0;
        padding: 0;
    }
    table {
        page-break-inside: avoid;
    }
    .payslip-container {
        page-break-after: avoid;
        page-break-inside: avoid;
    }
}
    </style>
</head>
<body class="text-gray-700 antialiased min-h-screen">

    <nav class="bg-[#8a1f27] text-white px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md no-print">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#b0303b] rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-file-invoice text-[#f4e8c1]"></i>
            </div>
            <span class="font-bold text-lg">Philtech GMA</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm hidden sm:block" id="userName">Accountant</span>
            <div class="relative group">
                <img src="https://i.pravatar.cc/150?u=accountant" class="w-8 h-8 rounded-full border-2 border-white cursor-pointer">
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 hidden group-hover:block z-50">
                    <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="p-6 md:p-8 max-w-7xl mx-auto">
        
        <div class="flex justify-between items-center mb-6 no-print">
            <div>
                <h1 class="text-2xl font-bold text-[#8a1f27]">Payslip Generator</h1>
                <p class="text-gray-500 text-sm mt-1" id="currentDate"></p>
            </div>
            <button onclick="goBack()" class="bg-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:shadow-md transition-shadow flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>

        <!-- Selection Panel -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 no-print">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Employee</label>
                    <select id="employeeSelect" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#b0303b] focus:border-transparent">
                        <option value="">-- Select Employee --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Payroll Period</label>
                    <select id="periodSelect" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#b0303b] focus:border-transparent">
                        <option value="">-- Select Period --</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="generatePayslip()" id="generateBtn" class="btn-primary flex items-center gap-2" disabled>
                        <i class="fa-solid fa-file-invoice"></i> Generate Payslip
                    </button>
                    <button onclick="downloadPDF()" id="downloadBtn" class="btn-success flex items-center gap-2" disabled>
                        <i class="fa-solid fa-download"></i> PDF
                    </button>
                    <button onclick="printPayslip()" id="printBtn" class="btn-secondary flex items-center gap-2" disabled>
                        <i class="fa-solid fa-print"></i> Print
                    </button>
                </div>
            </div>
        </div>

        <!-- Payslip Preview -->
        <div class="payslip-preview" id="payslipPreview">
            <div class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-file-invoice text-4xl mb-3"></i>
                <p>Select an employee and period to generate payslip</p>
            </div>
        </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/payslip-generator.js"></script>
    <script>
        let currentPayslipData = null;
        let currentTemplateType = null;
        let allEmployees = [];
        let allPayroll = [];

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            
            await loadData();
            
            document.getElementById('employeeSelect').addEventListener('change', onEmployeeChange);
            document.getElementById('periodSelect').addEventListener('change', onPeriodChange);
        });

        async function loadData() {
            showLoading(true);
            try {
                await Database.ensureDatabaseReady();
                allEmployees = await Database.getAllEmployees();
                allPayroll = await Database.getAllPayroll();
                
                populateEmployeeSelect();
                console.log("Loaded", allEmployees.length, "employees and", allPayroll.length, "payroll records");
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading employee data. Please refresh.');
            } finally {
                showLoading(false);
            }
        }

        function populateEmployeeSelect() {
            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">-- Select Employee --</option>';
            
            // Sort employees by name
            const sortedEmployees = [...allEmployees].sort((a, b) => 
                (a.full_name || '').localeCompare(b.full_name || '')
            );
            
            sortedEmployees.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.id;
                option.textContent = `${emp.full_name} - ${emp.position || 'Employee'}`;
                select.appendChild(option);
            });
        }

        function onEmployeeChange() {
            const employeeId = document.getElementById('employeeSelect').value;
            const periodSelect = document.getElementById('periodSelect');
            
            if (!employeeId) {
                periodSelect.innerHTML = '<option value="">-- Select Period --</option>';
                periodSelect.disabled = true;
                document.getElementById('generateBtn').disabled = true;
                return;
            }
            
            // Filter payroll records for selected employee
            const employeePayroll = allPayroll.filter(p => p.employee_id == employeeId);
            
            periodSelect.innerHTML = '<option value="">-- Select Period --</option>';
            
            // Get unique periods
            const uniquePeriods = new Map();
            employeePayroll.forEach(p => {
                const key = `${p.period_start}|${p.period_end}`;
                if (!uniquePeriods.has(key) && p.period_start && p.period_end) {
                    uniquePeriods.set(key, {
                        start: p.period_start,
                        end: p.period_end,
                        display: formatPeriodDisplay(p.period_start, p.period_end),
                        payroll_id: p.id
                    });
                } else if (!uniquePeriods.has(key) && p.period) {
                    uniquePeriods.set(p.period, {
                        start: null,
                        end: null,
                        display: p.period,
                        payroll_id: p.id
                    });
                }
            });
            
            for (const [key, period] of uniquePeriods) {
                const option = document.createElement('option');
                option.value = period.payroll_id;
                option.textContent = period.display;
                option.dataset.start = period.start || '';
                option.dataset.end = period.end || '';
                periodSelect.appendChild(option);
            }
            
            periodSelect.disabled = false;
        }

        function onPeriodChange() {
            const payrollId = document.getElementById('periodSelect').value;
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = !payrollId;
            
            if (!payrollId) {
                document.getElementById('downloadBtn').disabled = true;
                document.getElementById('printBtn').disabled = true;
            }
        }

        function formatPeriodDisplay(start, end) {
            if (start && end) {
                const startDate = new Date(start);
                const endDate = new Date(end);
                return `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            }
            return 'Custom Period';
        }

        async function generatePayslip() {
            const payrollId = document.getElementById('periodSelect').value;
            if (!payrollId) {
                alert('Please select an employee and period');
                return;
            }
            
            showLoading(true);
            
            try {
                // Fetch payslip data from API
                const response = await fetch(`/api/payslip.php?payroll_id=${payrollId}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to load payslip data');
                }
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to generate payslip');
                }
                
                currentPayslipData = result.data;
                currentTemplateType = result.data.type;
                
                // Render preview
                renderPreview();
                
                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('printBtn').disabled = false;
                
            } catch (error) {
                console.error('Error generating payslip:', error);
                alert('Error: ' + error.message);
                document.getElementById('payslipPreview').innerHTML = `
                    <div class="text-center py-12 text-red-500">
                        <i class="fa-solid fa-circle-exclamation text-4xl mb-3"></i>
                        <p>Error loading payslip: ${error.message}</p>
                        <p class="text-sm text-gray-400 mt-2">Please ensure payroll has been generated for this period.</p>
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        function renderPreview() {
            const container = document.getElementById('payslipPreview');
            
            let html = '';
            if (currentTemplateType === 'faculty') {
                html = window.payslipGenerator.generateFacultyHTML(currentPayslipData);
            } else if (currentTemplateType === 'admin') {
                html = window.payslipGenerator.generateAdminHTML(currentPayslipData);
            } else if (currentTemplateType === 'guard') {
                html = window.payslipGenerator.generateGuardHTML(currentPayslipData);
            } else if (currentTemplateType === 'sa') {
                html = window.payslipGenerator.generateSAHTML(currentPayslipData);
            } else {
                html = window.payslipGenerator.generateFacultyHTML(currentPayslipData);
            }
            
            container.innerHTML = html;
            
            // Generate QR code if container exists and data has QR info
            setTimeout(() => {
                const qrContainer = document.getElementById('qrCodeContainer');
                if (qrContainer && currentPayslipData.qr_data) {
                    try {
                        new QRCode(qrContainer, {
                            text: currentPayslipData.qr_data,
                            width: 80,
                            height: 80
                        });
                    } catch (e) {
                        console.warn('QR Code generation failed:', e);
                    }
                }
            }, 100);
        }

        async function downloadPDF() {
            if (!currentPayslipData) {
                alert('No payslip generated yet');
                return;
            }
            
            if (currentPayslipData.status !== 'Approved') {
                if (!confirm('This payslip is not yet approved. Download anyway?')) {
                    return;
                }
            }
            
            showLoading(true);
            
            try {
                await window.payslipGenerator.generatePDF(currentPayslipData, currentTemplateType);
            } catch (error) {
                console.error('PDF generation error:', error);
                alert('Error generating PDF: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function printPayslip() {
            if (!currentPayslipData) {
                alert('No payslip generated yet');
                return;
            }
            
            window.payslipGenerator.printPayslip(currentPayslipData, currentTemplateType);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function goBack() {
            window.location.href = 'payroll.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
